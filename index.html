<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Community archive on Swarm</title>
    <style>
      :root { color-scheme: dark; --bg: #0b0b0c; --fg: #f5f5f5; --muted: #b8b8b8; --accent: #ffb000; --ok: #4ade80; --bad: #ff6b6b; font: 16px/1.5 system-ui, sans-serif; }
      body { margin: 0; background: var(--bg); color: var(--fg); }
      main { max-width: 900px; margin: 0 auto; padding: 24px; }
      h1 { color: var(--accent); margin-bottom: 4px; }
      article, h1, h3 { overflow-wrap: anywhere; }
      section, article { border: 1px solid #333; border-radius: 8px; padding: 16px; margin: 16px 0; }
      .mono, pre { font-family: ui-monospace, monospace; word-break: break-all; white-space: pre-wrap; }
      .health, .served { color: var(--ok); }
      .log { max-height: 280px; overflow: auto; background: #000; padding: 12px; }
      button { background: var(--accent); color: #000; border: 0; border-radius: 6px; padding: 8px 14px; font-weight: 600; margin: 4px 8px 4px 0; cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: default; }
      input { background: #1a1a1a; color: var(--fg); border: 1px solid #555; border-radius: 6px; padding: 8px; margin: 4px 8px 4px 0; }
      label { display: inline-flex; flex-direction: column; font-size: 13px; color: var(--muted); }
      img, audio { max-width: 100%; margin-top: 12px; }
      .config-error { color: var(--bad); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="src/index.tsx"></script>
  </body>
</html>
